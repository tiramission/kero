name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand, it releases mygo.json's version from the branch it runs
  # on, in a new draft: the draft of the version, if there is one, and its
  # tag go, so the release is of this commit. A published release stays.
  workflow_dispatch:

permissions:
  contents: write # the draft release, its tag, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against mygo.json's version
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Replace the draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = "false" ]; then
            echo "::error::$tag is published already: bump the version in mygo.json"
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git push origin ":refs/tags/$tag"
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$tag" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The builds upload the one SHA256SUMS of the release, merging the
      # lines already there: at the same time, each would see none and try
      # to create it. One at a time, the second merges the first's.
      max-parallel: 1
      matrix:
        include:
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # This fork has no Developer ID certificate, so the macOS app is
      # signed ad hoc: Gatekeeper blocks it on other Macs. The macOS build
      # still runs here, on a macOS runner; add the certificate and notary
      # step back when one is available.
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  # What a release is of passes its tests, as from a branch run by hand.
  test:
    needs: draft-release
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/...

  # The server build of Kero, for machines whose sessions the app shows
  # (Settings › Hosts): kerod and the kero CLI without the app, with
  # libghostty-vt, for Linux, macOS and Windows, which the install scripts
  # install and the server build updates itself from (internal/update).
  # Each archive is checked on its own platform.
  server:
    needs: draft-release
    name: Server
    uses: ./.github/workflows/server.yml

  # Signed apart from the jobs that run what was built, with the key the
  # app's updates are signed with, which the server build checks.
  server-sign:
    needs: [server, test]
    name: Sign the server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: build/server
      - name: Sign
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go run ./internal/update/sign build/server/*.tar.gz build/server/*.zip
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version mygo.json)"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            build/server/*.tar.gz build/server/*.tar.gz.sig build/server/*.tar.gz.sha256 \
            build/server/*.zip build/server/*.zip.sig build/server/*.zip.sha256 \
            build/server/install-server.sh build/server/install-server.ps1

  # A release without the server build would break the install scripts'
  # latest links, and the app's Install and Update of hosts: say so before
  # it is published.
  assets:
    needs: [build, server-sign]
    name: Check the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(jq -r .version mygo.json)"
          names="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          want="install-server.sh install-server.ps1 install.sh"
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            ext=tar.gz
            case "$p" in windows-*) ext=zip ;; esac
            a="kero-server-$version-$p.$ext"
            want="$want $a $a.sig $a.sha256"
          done
          for w in $want; do
            echo "$names" | grep -qxF "$w" || { echo "::error::v$version has no $w"; exit 1; }
          done

  # The changelog is the release's notes, and a checked release publishes
  # itself: a tag is not left as a draft for someone to edit and publish.
  publish:
    needs: [assets]
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish with the changelog's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version mygo.json)"
          tag="v$version"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            { line=$0; sub(/\r$/, "", line) }
            line == "## " version { found=1; next }
            found && line ~ /^## / { exit }
            found { print }
          ' CHANGELOG.fork.md | sed 's/\r$//' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.fork.md has no section for $tag"
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" --draft=false

  # The cask in tiramission/homebrew-casks follows a published release with
  # macOS DMGs. 2026.11.1 skipped them while macOS runners were congested;
  # such a release leaves the cask alone instead of failing the workflow.
  update-cask:
    needs: [publish]
    name: Update the Homebrew cask
    runs-on: ubuntu-latest
    concurrency:
      group: update-cask
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: source

      - uses: actions/checkout@v7
        with:
          repository: tiramission/homebrew-casks
          ref: main
          path: casks
          fetch-depth: 0
          ssh-key: ${{ secrets.CASK_REPO_DEPLOY_KEY }}

      - name: Update Casks/kero.rb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C casks checkout -B main origin/main
          version="$(jq -r .version source/mygo.json)"
          tag="v$version"
          arm_asset="kero-$version-arm64.dmg"
          intel_asset="kero-$version-amd64.dmg"
          names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if ! grep -qxF "$arm_asset" <<< "$names" || ! grep -qxF "$intel_asset" <<< "$names"; then
            echo "::warning::$tag has no macOS DMGs; leaving the cask alone."
            exit 0
          fi
          assets="$RUNNER_TEMP/kero-cask-assets"
          mkdir -p "$assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$arm_asset" --pattern "$intel_asset" \
            --dir "$assets"
          arm="$(sha256sum "$assets/$arm_asset" | cut -d' ' -f1)"
          intel="$(sha256sum "$assets/$intel_asset" | cut -d' ' -f1)"
          python3 - "$version" "$arm" "$intel" <<'PY'
          import pathlib, re, sys
          version, arm, intel = sys.argv[1:]
          path = pathlib.Path("casks/Casks/kero.rb")
          text = path.read_text().replace("\r\n", "\n")
          before = text
          text = re.sub(r'  version "[^"]+"', f'  version "{version}"', text, count=1)
          text = re.sub(
              r'  sha256 arm:\s+"[0-9a-f]{64}",\n         intel: "[0-9a-f]{64}"',
              f'  sha256 arm:   "{arm}",\n         intel: "{intel}"',
              text,
              count=1,
          )
          if text == before:
              if f'version "{version}"' not in text or arm not in text or intel not in text:
                  raise SystemExit("the cask did not change")
              print("The cask already has this version and hashes.")
          else:
              path.write_text(text)
          PY
          git -C casks config user.name "github-actions[bot]"
          git -C casks config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C casks add Casks/kero.rb
          if git -C casks diff --cached --quiet; then
            echo "Casks/kero.rb already has $tag."
            exit 0
          fi
          git -C casks commit -m "Update Kero to $version"
          git -C casks pull --rebase origin main
          git -C casks push origin main

